name: Import PointBlock gameplay videos

on:
  push:
    paths:
      - '.github/workflows/import-game-videos.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import original verified video assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = 'dacb4da39ade296d8bcd94b3a62e741ed22461db'
          $root = "https://raw.githubusercontent.com/Heynode92/blockbudies/$revision/src/assets/video"
          $assets = @(
            @{ Name = 'bomb_mission_demo.mp4'; Sha = 'd63d6d88c467a6c04143635d79bb8e30e3fe0524' },
            @{ Name = 'deatch_match_demo.mp4'; Sha = 'd3aa7d1de2f6725f92fb2fc39dc5e3fca8c4738c' }
          )
          New-Item -ItemType Directory -Force -Path 'src/assets/video' | Out-Null
          foreach ($asset in $assets) {
            $file = "src/assets/video/$($asset.Name)"
            if ((Test-Path $file) -and ((git hash-object -- $file).Trim() -eq $asset.Sha)) {
              Write-Host "Already present and verified: $file"
              continue
            }
            Invoke-WebRequest -Uri "$root/$($asset.Name)" -OutFile $file -ErrorAction Stop
            $sha = (git hash-object -- $file).Trim()
            if ($sha -ne $asset.Sha) {
              Remove-Item -Force $file
              throw "Integrity verification failed for $file"
            }
            Write-Host "Verified $file"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/assets/video/bomb_mission_demo.mp4' 'src/assets/video/deatch_match_demo.mp4'
          if (-not (git diff --cached --quiet)) {
            git commit -m 'assets: import verified PointBlock gameplay videos'
            git push origin HEAD:main
          } else {
            Write-Host 'Both gameplay videos already committed.'
          }
